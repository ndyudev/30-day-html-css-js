<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 3 | Modal Popup Material</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./assets/style.css">
    <script src="https://kit.fontawesome.com/f4e3fc99b3.js" crossorigin="anonymous"></script>
    
</head>
<body>
    <button class="open_modal_btn">Open Modal</button>
    <div class="modal hide">
        <div class="modal_inner">
            <div class="modal_header">
                <h2>Welcome to DXA Technology</h2>
                <i class="fa-solid fa-xmark"></i> 
            </div>
            <div class="modal_body">
                <h2>Modal</h2>
                <p>Đây là phần body của modal</p>
            </div>
            <div class="modal_footer">
                <button class="close_modal_btn">Close</button>
            </div>
        </div>
    </div>
    <script src="./js/main.js"></script>
</body>
</html>
