<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 9 | Weather App</title>
    <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>
    <div class="weather-container">
        <input type="text" class="search" placeholder="Nhập tên thành phố...">
        <div class="content">
            <h1 class="capital">
                <span class="city">Ho Chi Minh City</span>
                <span class="country">VN</span>
            </h1>
            <div class="nhietdo">--°C</div>
            <div class="weather-info">
                <div class="weather-desc">--</div>
                <div class="weather-details">
                    <div class="humidity">
                        <span class="label">Độ ẩm:</span>
                        <span class="value">--%</span>
                    </div>
                    <div class="wind">
                        <span class="label">Gió:</span>
                        <span class="value">-- km/h</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="./js/main.js"></script>
</body>
</html>
