<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 4 | Image Gallery</title>
    <link rel="stylesheet" href="./assets/style.css">
    <script src="https://kit.fontawesome.com/f4e3fc99b3.js" crossorigin="anonymous"></script>
</head>
<body>
    <div class="wrapper">
        <!-- Item Image -->
        <div class="image">
            <img src="./assets/image/1.jpeg" alt="image">
        </div>
        <!-- Item Image -->
        <div class="image">
            <img src="./assets/image/2.jpeg" alt="image">
        </div>
        <!-- Item Image -->
        <div class="image">
            <img src="./assets/image/3.jpeg" alt="image">
        </div>
        <!-- Item Image -->
        <div class="image">
            <img src="./assets/image/4.jpeg" alt="image">
        </div>
        <!-- Item Image -->
        <div class="image">
            <img src="./assets/image/5.jpeg" alt="image">
        </div>
        <!-- Item Image -->
        <div class="image">
            <img src="./assets/image/6.jpeg" alt="image">
        </div>
        <!-- Item Image -->
        <div class="image">
            <img src="./assets/image/7.jpg" alt="image">
        </div>
        <!-- Item Image -->
        <div class="image">
            <img src="./assets/image/8.jpg" alt="image">
        </div>
    </div>
    
    <div class="gallery">
        <i class="fa-solid fa-xmark close"></i>
        <div class="gallery-inner">
            <img src="./assets/image/1.jpeg" alt="image">
        </div>
        <div class="control">
            <div class="control prev">
                <i class="fa-solid fa-chevron-left"></i>
            </div>
            <div class="control next">
                <i class="fa-solid fa-chevron-right"></i>
            </div>
        </div>
    </div>
    <script src="./js/main.js"></script>
</body>
</html>
